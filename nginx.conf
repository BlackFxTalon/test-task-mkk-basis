server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Отдельная конечная точка для healthcheck контейнера.
  # default_type (а не add_header): add_header добавил бы второй
  # Content-Type к базовому application/octet-stream.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Хешированные ресурсы сборки неизменяемы и кешируются агрессивно.
  location /_nuxt/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker всегда должен перепроверяться: иначе обновления
  # приложения застревают в HTTP-кеше браузера.
  location = /sw.js {
    access_log off;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Манифест PWA перепроверяется (его содержимое меняется при смене иконок
  # или метаданных), сами иконки и логотип версионированы ревизиями в SW
  # и кешируются агрессивно.
  location = /manifest.webmanifest {
    access_log off;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /pwa-icons/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /logo.png {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML-оболочка никогда не кешируется, чтобы обновления подхватывались сразу.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # History fallback: прямые URL редактора (/notes/new, /notes/:id)
  # отдаются SPA-оболочкой вместо серверной 404. Проверка каталога
  # опущена сознательно: иначе nginx перенаправляет /notes/new на
  # /notes/new/ (301) вместо мгновенной отдачи оболочки.
  location / {
    try_files $uri /index.html;
  }
}
